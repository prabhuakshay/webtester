<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebTester demo — page 2</title>
  <style>
    :root { --bg: #fff; --fg: #18202c; --muted: #5d6778; --card: #f4f6fa; --accent: #3a6ff0; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0f131a; --fg: #e8ebf2; --muted: #98a2b5; --card: #1a202b; --accent: #7aa2ff; color-scheme: dark; } }
    body { margin: 0; font: 16px/1.6 system-ui, 'Segoe UI', sans-serif; background: var(--bg); color: var(--fg); }
    main { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    a { color: var(--accent); }
    .card { background: var(--card); padding: 20px; border-radius: 14px; margin: 16px 0; }
    .tabs { display: flex; gap: 8px; }
    .tabs button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 0; background: var(--card); color: var(--fg); cursor: pointer; }
    .tabs button.on { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <main>
    <h1>Page 2</h1>
    <p>Every pane followed you here because navigation sync is on. Use the back button in the toolbar to go back in all panes.</p>
    <div class="tabs" id="tabs">
      <button class="on" data-t="1">Overview</button>
      <button data-t="2">Details</button>
      <button data-t="3">Reviews</button>
    </div>
    <div class="card" id="panel">Overview content.</div>
    <p><a href="index.html">← Back to the demo page</a> · <a href="index.html#signup">Jump to the sign-up form</a></p>
  </main>
  <script>
    document.getElementById('tabs').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('on', x === b));
      document.getElementById('panel').textContent = `${b.textContent} content.`;
      history.replaceState(null, '', `#tab-${b.dataset.t}`);
    });
  </script>
</body>
</html>
