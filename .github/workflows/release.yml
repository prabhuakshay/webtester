name: Release

# Builds the Windows installer and portable .exe and publishes them to a
# GitHub Release whenever a version tag (v1.2.3) is pushed.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build & publish (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG. Update package.json or re-tag."
            exit 1
          fi
          echo "VERSION=$PKG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Build installer and portable exe
        run: npm run dist
        env:
          # No code-signing certificate is configured; skip signing auto-discovery.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: WebTester ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## Download

            | File | What it is |
            |---|---|
            | **WebTester-Setup-${{ env.VERSION }}.exe** | Installer (recommended): adds Start menu and desktop shortcuts |
            | **WebTester-${{ env.VERSION }}-portable.exe** | Portable: runs without installing |

            Windows may show "Windows protected your PC" on first launch because the app isn't code-signed yet. Choose **More info → Run anyway**. Verify downloads with `SHA256SUMS.txt`.

            See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          files: |
            dist/WebTester-Setup-*.exe
            dist/WebTester-*-portable.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
